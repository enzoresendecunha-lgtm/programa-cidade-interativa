<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow, noarchive"><title>PRODUZA — Parque Produtivo | Cidade Interativa</title><meta property="og:title" content="PRODUZA — Parque Produtivo"><meta property="og:description" content="Conheça a apresentação do Núcleo Vocacional PRODUZA."><meta property="og:type" content="website"><meta property="og:url" content="https://programacidadeinterativa.com.br/projetos/produza/"><meta property="og:image" content="https://programacidadeinterativa.com.br/projetos/produza/convite.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><style>*{box-sizing:border-box}body{margin:0;background:#161616;color:#eee;font:16px system-ui}header{background:#633e2d;padding:14px;text-align:center;letter-spacing:2px}main{max-width:1100px;margin:auto;padding:12px;text-align:center}.stage{display:flex;justify-content:center;align-items:center;min-height:40vh}.stage img{max-width:100%;max-height:76vh;object-fit:contain;box-shadow:0 5px 24px #000}nav{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:12px}button{background:#333;color:white;border:1px solid #777;border-radius:6px;padding:10px 15px;font:inherit;cursor:pointer}button:disabled{opacity:.35}small{color:#aaa}a{color:#ddd}body.zoom .stage img{max-height:none;width:100%} </style></head><body><header>PRODUZA · PARQUE PRODUTIVO</header><main id="reader"><div class="stage"><img id="page" src="p-01.webp" alt="Página 1 de 16"></div><nav><button id="prev">‹ Anterior</button><span id="count" aria-live="polite">1 / 16</span><button id="next">Próxima ›</button><button id="zoom">Ampliar</button><button id="full">Tela cheia</button></nav><small>Programa Cidade Interativa · Apresentação de projeto</small></main><script>let n=1;const $=id=>document.getElementById(id);function show(v){n=Math.max(1,Math.min(16,v));$('page').src='p-'+String(n).padStart(2,'0')+'.webp';$('page').alt='Página '+n+' de 16';$('count').textContent=n+' / 16';$('prev').disabled=n===1;$('next').disabled=n===16; if(n<16){new Image().src='p-'+String(n+1).padStart(2,'0')+'.webp'}}$('prev').onclick=()=>show(n-1);$('next').onclick=()=>show(n+1);$('zoom').onclick=()=>{document.body.classList.toggle('zoom');$('zoom').textContent=document.body.classList.contains('zoom')?'Reduzir':'Ampliar'};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else document.body.classList.toggle('zoom')}catch{document.body.classList.toggle('zoom')}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(n+1);if(e.key==='ArrowLeft')show(n-1)});let x=0;$('page').addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});$('page').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-x;if(Math.abs(d)>65&&!document.body.classList.contains('zoom'))show(n+(d<0?1:-1))},{passive:true});show(1);</script></body></html>
